name: Local kit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fictional-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, reviewed pin
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and hook protocol tests with fictional data
        run: python -m unittest discover -s tests -v
      - name: Public-source hygiene and skill structure
        run: python scripts/check_repository.py
      - name: Capability report
        run: python scripts/kit.py doctor
